<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profil Saya - Kebutuhan</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #f5f7fb;

      color: #172033;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }


    /* =================================
       HEADER
    ================================= */

    .topbar {
      height: 64px;

      background: white;

      border-bottom:
        1px solid #e5e7eb;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 24px;

      position: sticky;

      top: 0;

      z-index: 50;
    }

    .logo {
      font-size: 20px;

      font-weight: 800;
    }

    .top-actions {
      display: flex;

      gap: 10px;

      align-items: center;
    }


    /* =================================
       BUTTON
    ================================= */

    .btn {
      border: 0;

      border-radius: 10px;

      padding:
        10px 15px;

      font-weight: 700;

      background: #e5e7eb;

      color: #111827;
    }

    .btn.primary {
      background: #2563eb;

      color: white;
    }

    .btn.danger {
      background: #fee2e2;

      color: #b91c1c;
    }


    /* =================================
       CONTAINER
    ================================= */

    .container {
      max-width: 1050px;

      margin: auto;

      padding:
        25px 18px 70px;
    }


    /* =================================
       PROFILE HERO
    ================================= */

    .profile-card {
      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      color: white;

      border-radius: 20px;

      padding: 28px;

      display: flex;

      align-items: center;

      gap: 22px;

      margin-bottom: 22px;

      box-shadow:
        0 10px 30px
        rgba(37,99,235,.15);
    }

    .profile-photo {
      width: 100px;

      height: 100px;

      border-radius: 50%;

      object-fit: cover;

      border:
        4px solid
        rgba(255,255,255,.8);

      background: #e5e7eb;
    }

    .profile-main {
      min-width: 0;
    }

    .profile-main h1 {
      margin:
        0 0 7px;

      font-size: 28px;
    }

    .profile-email {
      opacity: .85;

      margin-bottom: 12px;

      word-break: break-all;
    }

    .google-badge {
      display: inline-block;

      padding:
        6px 10px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.15);

      font-size: 12px;
    }


    /* =================================
       STATS
    ================================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;

      margin-bottom: 30px;
    }

    .stat-card {
      background: white;

      border:
        1px solid #eef0f4;

      border-radius: 15px;

      padding: 19px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,.04);
    }

    .stat-icon {
      font-size: 22px;

      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 24px;

      font-weight: 900;

      margin-bottom: 4px;
    }

    .stat-label {
      color: #6b7280;

      font-size: 13px;
    }


    /* =================================
       RATING
    ================================= */

    .rating-card {
      background: white;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 28px;

      border:
        1px solid #eef0f4;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }

    .rating-left {
      display: flex;

      align-items: center;

      gap: 15px;
    }

    .rating-number {
      font-size: 36px;

      font-weight: 900;
    }

    .stars {
      color: #f59e0b;

      font-size: 21px;

      letter-spacing: 2px;
    }

    .rating-text {
      color: #6b7280;

      font-size: 13px;

      margin-top: 3px;
    }


    /* =================================
       SECTIONS
    ================================= */

    .section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 13px;
    }

    .section-header h2 {
      margin: 0;

      font-size: 21px;
    }

    .section-count {
      color: #6b7280;

      font-size: 13px;
    }


    /* =================================
       HISTORY CARD
    ================================= */

    .history-list {
      display: grid;

      gap: 12px;
    }

    .history-card {
      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 14px;

      padding: 17px;

      transition: .2s;
    }

    .history-card:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 5px 18px
        rgba(0,0,0,.06);
    }

    .history-top {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      align-items: flex-start;
    }

    .history-title {
      margin: 0;

      font-size: 17px;

      line-height: 1.4;
    }

    .history-description {
      color: #6b7280;

      font-size: 13px;

      line-height: 1.5;

      margin:
        8px 0;
    }

    .history-meta {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      color: #6b7280;

      font-size: 12px;
    }


    /* =================================
       BADGE
    ================================= */

    .badge {
      display: inline-block;

      padding:
        5px 9px;

      border-radius: 20px;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;
    }

    .badge-open {
      background: #dbeafe;

      color: #1d4ed8;
    }

    .badge-progress {
      background: #fef3c7;

      color: #92400e;
    }

    .badge-completed {
      background: #dcfce7;

      color: #166534;
    }

    .badge-pending {
      background: #fef3c7;

      color: #92400e;
    }

    .badge-accepted {
      background: #dcfce7;

      color: #166534;
    }

    .badge-rejected {
      background: #fee2e2;

      color: #991b1b;
    }


    /* =================================
       OFFER PRICE
    ================================= */

    .offer-price {
      font-size: 18px;

      font-weight: 900;

      color: #16a34a;

      white-space: nowrap;
    }


    /* =================================
       EMPTY
    ================================= */

    .empty {
      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 14px;

      padding: 30px 20px;

      text-align: center;

      color: #6b7280;
    }

    .empty-icon {
      font-size: 32px;

      margin-bottom: 8px;
    }


    /* =================================
       LOADING
    ================================= */

    .loading {
      padding: 30px;

      text-align: center;

      color: #6b7280;
    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 800px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 600px) {

      .topbar {
        padding: 0 12px;
      }

      .logo {
        font-size: 17px;
      }

      .profile-card {
        padding: 22px;

        flex-direction: column;

        text-align: center;
      }

      .profile-main h1 {
        font-size: 24px;
      }

      .profile-photo {
        width: 90px;

        height: 90px;
      }

      .stats {
        grid-template-columns:
          1fr 1fr;

        gap: 9px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-number {
        font-size: 21px;
      }

      .rating-card {
        align-items: flex-start;

        flex-direction: column;
      }

      .history-top {
        flex-direction: column;
      }

      .offer-price {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<!-- ======================================
     HEADER
======================================= -->

<header class="topbar">

  <div class="logo">
    🚀 Kebutuhan
  </div>

  <div class="top-actions">

    <button
      id="dashboardBtn"
      class="btn primary">

      Dashboard

    </button>

    <button
      id="logoutBtn"
      class="btn danger">

      Keluar

    </button>

  </div>

</header>


<main class="container">


  <!-- ====================================
       PROFILE
  ===================================== -->

  <section class="profile-card">

    <img
      id="profilePhoto"
      class="profile-photo"
      src=""
      alt="Foto profil"
    >

    <div class="profile-main">

      <h1 id="profileName">
        Memuat...
      </h1>

      <div
        id="profileEmail"
        class="profile-email">

        Memuat...

      </div>

      <span class="google-badge">
        🔵 Login dengan Google
      </span>

    </div>

  </section>


  <!-- ====================================
       STATISTICS
  ===================================== -->

  <section class="stats">


    <div class="stat-card">

      <div class="stat-icon">
        ⭐
      </div>

      <div
        id="ratingStat"
        class="stat-number">

        0.0

      </div>

      <div class="stat-label">
        Rating
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-icon">
        📌
      </div>

      <div
        id="needStat"
        class="stat-number">

        0

      </div>

      <div class="stat-label">
        Kebutuhan dibuat
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-icon">
        💰
      </div>

      <div
        id="offerStat"
        class="stat-number">

        0

      </div>

      <div class="stat-label">
        Penawaran
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-icon">
        ✅
      </div>

      <div
        id="completedStat"
        class="stat-number">

        0

      </div>

      <div class="stat-label">
        Selesai
      </div>

    </div>


  </section>


  <!-- ====================================
       RATING
  ===================================== -->

  <section class="rating-card">

    <div class="rating-left">

      <div
        id="ratingNumber"
        class="rating-number">

        0.0

      </div>

      <div>

        <div
          id="stars"
          class="stars">

          ☆☆☆☆☆

        </div>

        <div
          id="ratingText"
          class="rating-text">

          Belum memiliki rating

        </div>

      </div>

    </div>

  </section>


  <!-- ====================================
       RIWAYAT KEBUTUHAN
  ===================================== -->

  <section class="section">

    <div class="section-header">

      <h2>
        📌 Riwayat Kebutuhan
      </h2>

      <span
        id="needHistoryCount"
        class="section-count">

        0 kebutuhan

      </span>

    </div>


    <div
      id="needHistory"
      class="history-list">

      <div class="loading">
        Memuat riwayat...
      </div>

    </div>

  </section>


  <!-- ====================================
       RIWAYAT PENAWARAN
  ===================================== -->

  <section class="section">

    <div class="section-header">

      <h2>
        💰 Riwayat Penawaran
      </h2>

      <span
        id="offerHistoryCount"
        class="section-count">

        0 penawaran

      </span>

    </div>


    <div
      id="offerHistory"
      class="history-list">

      <div class="loading">
        Memuat riwayat...
      </div>

    </div>

  </section>


</main>


<script type="module">


  // ==========================================
  // FIREBASE
  // ==========================================

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    getDocs
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // ==========================================
  // FIREBASE CONFIG
  // ==========================================

  const firebaseConfig = {

    apiKey:
      "MASUKKAN_API_KEY_ANDA",

    authDomain:
      "MASUKKAN_PROJECT_ID.firebaseapp.com",

    projectId:
      "MASUKKAN_PROJECT_ID",

    storageBucket:
      "MASUKKAN_PROJECT_ID.firebasestorage.app",

    messagingSenderId:
      "MASUKKAN_MESSAGING_SENDER_ID",

    appId:
      "MASUKKAN_APP_ID"

  };


  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  let currentUser = null;

  let myNeeds = [];

  let myOffers = [];


  // ==========================================
  // DOM
  // ==========================================

  const profilePhoto =
    document.getElementById(
      "profilePhoto"
    );

  const profileName =
    document.getElementById(
      "profileName"
    );

  const profileEmail =
    document.getElementById(
      "profileEmail"
    );


  // ==========================================
  // AUTH
  // ==========================================

  onAuthStateChanged(
    auth,
    async user => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      currentUser =
        user;


      // PROFILE

      profileName.textContent =
        user.displayName ||
        "User";


      profileEmail.textContent =
        user.email ||
        "";


      profilePhoto.src =
        user.photoURL ||
        createAvatar(
          user.displayName
        );


      await loadProfileData();

    }
  );


  // ==========================================
  // LOAD PROFILE DATA
  // ==========================================

  async function loadProfileData() {

    try {

      await Promise.all([

        loadMyNeeds(),

        loadMyOffers()

      ]);


      renderStatistics();

      renderNeeds();

      renderOffers();

    }

    catch (error) {

      console.error(
        "Profile error:",
        error
      );

      document.getElementById(
        "needHistory"
      ).innerHTML = `
        <div class="empty">
          Gagal memuat riwayat.
        </div>
      `;

      document.getElementById(
        "offerHistory"
      ).innerHTML = `
        <div class="empty">
          Gagal memuat riwayat.
        </div>
      `;

    }

  }


  // ==========================================
  // LOAD NEEDS
  // ==========================================

  async function loadMyNeeds() {

    const q =
      query(

        collection(
          db,
          "needs"
        ),

        where(
          "ownerId",
          "==",
          currentUser.uid
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(q);


    myNeeds =
      snapshot.docs.map(
        doc => ({

          id:
            doc.id,

          ...doc.data()

        })
      );

  }


  // ==========================================
  // LOAD OFFERS
  // ==========================================

  async function loadMyOffers() {

    /*
      Firestore tidak bisa langsung
      mencari semua subcollection
      offers di semua needs menggunakan
      query biasa.

      Karena itu kita gunakan collectionGroup.
    */

    // collectionGroup di-import
    // secara dinamis agar kode tetap ringan.

    const {
      collectionGroup
    } = await import(
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
    );


    const q =
      query(

        collectionGroup(
          db,
          "offers"
        ),

        where(
          "providerId",
          "==",
          currentUser.uid
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(q);


    myOffers =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          needId:
            item.ref.parent.parent.id,

          ...item.data()

        })
      );

  }


  // ==========================================
  // STATISTICS
  // ==========================================

  function renderStatistics() {

    const totalNeeds =
      myNeeds.length;


    const totalOffers =
      myOffers.length;


    const completedNeeds =
      myNeeds.filter(
        need =>
          need.status ===
          "completed"
      ).length;


    document.getElementById(
      "needStat"
    ).textContent =
      totalNeeds;


    document.getElementById(
      "offerStat"
    ).textContent =
      totalOffers;


    document.getElementById(
      "completedStat"
    ).textContent =
      completedNeeds;


    /*
      Untuk sekarang rating berasal
      dari field rating pada users.

      Jika belum ada:
      0.0
    */

    const rating =
      Number(
        currentUser.rating || 0
      );


    document.getElementById(
      "ratingStat"
    ).textContent =
      rating.toFixed(1);


    document.getElementById(
      "ratingNumber"
    ).textContent =
      rating.toFixed(1);


    renderStars(
      rating
    );

  }


  // ==========================================
  // RATING
  // ==========================================

  function renderStars(
    rating
  ) {

    const stars =
      document.getElementById(
        "stars"
      );


    let html = "";


    for (
      let i = 1;
      i <= 5;
      i++
    ) {

      html +=
        i <= Math.round(rating)
          ? "★"
          : "☆";

    }


    stars.textContent =
      html;


    const ratingText =
      document.getElementById(
        "ratingText"
      );


    if (rating <= 0) {

      ratingText.textContent =
        "Belum memiliki rating";

    }

    else {

      ratingText.textContent =
        "Rating pengguna";

    }

  }


  // ==========================================
  // RENDER NEED HISTORY
  // ==========================================

  function renderNeeds() {

    const container =
      document.getElementById(
        "needHistory"
      );


    document.getElementById(
      "needHistoryCount"
    ).textContent =
      `${myNeeds.length} kebutuhan`;


    if (!myNeeds.length) {

      container.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            📭
          </div>

          Belum ada kebutuhan.

        </div>
      `;

      return;

    }


    container.innerHTML = "";


    myNeeds.forEach(
      need => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        const status =
          getStatus(
            need.status
          );


        card.innerHTML = `

          <div class="history-top">

            <div>

              <h3
                class="history-title">

                ${escapeHTML(
                  need.title
                )}

              </h3>

              <p
                class="history-description">

                ${escapeHTML(
                  truncate(
                    need.description,
                    150
                  )
                )}

              </p>

            </div>

            <span
              class="badge ${status.className}">

              ${status.text}

            </span>

          </div>


          <div
            class="history-meta">

            <span>
              💰 Rp ${formatMoney(
                need.budget
              )}
            </span>

            <span>
              📅 ${escapeHTML(
                need.deadline ||
                "-"
              )}
            </span>

            <span>
              📂 ${escapeHTML(
                getCategory(
                  need.category
                )
              )}
            </span>

          </div>

        `;


        container.appendChild(
          card
        );

      }
    );

  }


  // ==========================================
  // RENDER OFFERS
  // ==========================================

  function renderOffers() {

    const container =
      document.getElementById(
        "offerHistory"
      );


    document.getElementById(
      "offerHistoryCount"
    ).textContent =
      `${myOffers.length} penawaran`;


    if (!myOffers.length) {

      container.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            💰
          </div>

          Belum ada penawaran.

        </div>
      `;

      return;

    }


    container.innerHTML = "";


    myOffers.forEach(
      offer => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        const status =
          getStatus(
            offer.status
          );


        card.innerHTML = `

          <div class="history-top">

            <div>

              <h3
                class="history-title">

                Penawaran Anda

              </h3>

              <p
                class="history-description">

                ${escapeHTML(
                  offer.message
                )}

              </p>

            </div>


            <div
              class="offer-price">

              Rp ${formatMoney(
                offer.price
              )}

            </div>

          </div>


          <div
            class="history-meta">

            <span>
              ⏱ ${escapeHTML(
                offer.duration ||
                "-"
              )}
            </span>

            <span>
              📌 ID kebutuhan:
              ${escapeHTML(
                offer.needId
              )}
            </span>

            <span
              class="badge ${status.className}">

              ${status.text}

            </span>

          </div>

        `;


        container.appendChild(
          card
        );

      }
    );

  }


  // ==========================================
  // STATUS
  // ==========================================

  function getStatus(
    status
  ) {

    const map = {

      open: {
        text: "AKTIF",
        className:
          "badge-open"
      },

      in_progress: {
        text: "DIKERJAKAN",
        className:
          "badge-progress"
      },

      completed: {
        text: "SELESAI",
        className:
          "badge-completed"
      },

      pending: {
        text: "MENUNGGU",
        className:
          "badge-pending"
      },

      accepted: {
        text: "DITERIMA",
        className:
          "badge-accepted"
      },

      rejected: {
        text: "DITOLAK",
        className:
          "badge-rejected"
      }

    };


    return (
      map[status] ||
      {
        text:
          status ||
          "UNKNOWN",

        className:
          "badge-open"
      }
    );

  }


  // ==========================================
  // DASHBOARD
  // ==========================================

  document.getElementById(
    "dashboardBtn"
  ).addEventListener(
    "click",
    () => {

      window.location.href =
        "index.html";

    }
  );


  // ==========================================
  // LOGOUT
  // ==========================================

  document.getElementById(
    "logoutBtn"
  ).addEventListener(
    "click",
    async () => {

      await signOut(
        auth
      );

      window.location.href =
        "login.html";

    }
  );


  // ==========================================
  // HELPERS
  // ==========================================

  function formatMoney(
    value
  ) {

    return new Intl.NumberFormat(
      "id-ID"
    ).format(
      Number(value) || 0
    );

  }


  function truncate(
    text,
    max
  ) {

    if (!text) {
      return "";
    }


    return text.length > max

      ? text.substring(
          0,
          max
        ) + "..."

      : text;

  }


  function getCategory(
    category
  ) {

    const categories = {

      design:
        "Desain",

      website:
        "Website",

      programming:
        "Programming",

      marketing:
        "Marketing",

      writing:
        "Penulisan",

      other:
        "Lainnya"

    };


    return (
      categories[category] ||
      "Lainnya"
    );

  }


  function escapeHTML(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function createAvatar(
    name
  ) {

    const letter =
      encodeURIComponent(
        (
          name ||
          "U"
        )
        .charAt(0)
        .toUpperCase()
      );


    return (
      "https://ui-avatars.com/api/" +
      "?name=" +
      letter +
      "&background=2563eb" +
      "&color=ffffff" +
      "&size=128"
    );

  }


</script>
