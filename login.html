<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Kebutuhan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );
    }

    .box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 32px 25px;

      border-radius: 20px;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      color: #111827;
    }

    p {
      color: #6b7280;
      margin-bottom: 28px;
    }

    .google-btn {
      width: 100%;

      padding: 14px;

      border: 1px solid #d1d5db;

      border-radius: 10px;

      background: white;

      color: #111827;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      transition: .2s;
    }

    .google-btn:hover {
      background: #f9fafb;
      transform: translateY(-1px);
    }

    .google-icon {
      font-size: 20px;
    }

    .loading {
      margin-top: 15px;

      color: #6b7280;

      font-size: 14px;
    }

    .error {
      margin-top: 15px;

      padding: 12px;

      background: #fee2e2;

      color: #991b1b;

      border-radius: 9px;

      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 25px;

      font-size: 12px;

      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      🚀
    </div>

    <h1>
      Kebutuhan
    </h1>

    <p>
      Temukan dan tawarkan solusi
    </p>


    <button
      id="googleLogin"
      class="google-btn">

      <span class="google-icon">
        🌐
      </span>

      <span>
        Lanjutkan dengan Google
      </span>

    </button>


    <div
      id="loading"
      class="loading hidden">

      Membuka Google...

    </div>


    <div
      id="error"
      class="error hidden">
    </div>


    <div class="footer">

      Login aman menggunakan
      Firebase Authentication

    </div>

  </div>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // ==========================================
  // FIREBASE CONFIG
  // ==========================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyCUFHkwOfNo-JCGHWG3dWcnISoYLg7vGnY",

    authDomain:
      "butuhin.firebaseapp.com",

    projectId:
      "butuhin",

    storageBucket:
      "butuhin.firebasestorage.app",

    messagingSenderId:
      "331896660506",

    appId:
      "1:331896660506:web:7a03f433101b81dd74e7a3"

  };


  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const provider =
    new GoogleAuthProvider();


  // ==========================================
  // ELEMENT
  // ==========================================

  const googleLogin =
    document.getElementById(
      "googleLogin"
    );

  const loading =
    document.getElementById(
      "loading"
    );

  const errorBox =
    document.getElementById(
      "error"
    );


  // ==========================================
  // CEK LOGIN
  // ==========================================

  onAuthStateChanged(
    auth,
    user => {

      if (user) {

        window.location.href =
          "index.html";

      }

    }
  );


  // ==========================================
  // GOOGLE LOGIN
  // ==========================================

  googleLogin.addEventListener(
    "click",
    async () => {

      errorBox.classList.add(
        "hidden"
      );

      googleLogin.disabled =
        true;

      loading.classList.remove(
        "hidden"
      );


      try {

        const result =
          await signInWithPopup(
            auth,
            provider
          );


        const user =
          result.user;


        // =====================================
        // SIMPAN USER KE FIRESTORE
        // =====================================

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const userSnap =
          await getDoc(
            userRef
          );


        if (!userSnap.exists()) {

          await setDoc(
            userRef,
            {

              uid:
                user.uid,

              name:
                user.displayName ||
                "User",

              email:
                user.email ||
                "",

              photo:
                user.photoURL ||
                "",

              createdAt:
                serverTimestamp()

            }
          );

        }


        // =====================================
        // KE DASHBOARD
        // =====================================

        window.location.href =
          "index.html";


      } catch (error) {

        console.error(error);


        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          showError(
            "Login dibatalkan."
          );

        }

        else if (
          error.code ===
          "auth/popup-blocked"
        ) {

          showError(
            "Popup Google diblokir browser. Izinkan popup lalu coba lagi."
          );

        }

        else {

          showError(
            error.message ||
            "Login Google gagal."
          );

        }


        googleLogin.disabled =
          false;

        loading.classList.add(
          "hidden"
        );

      }

    }
  );


  function showError(
    message
  ) {

    errorBox.textContent =
      message;

    errorBox.classList.remove(
      "hidden"
    );

  }

</script>

</body>
</html>
