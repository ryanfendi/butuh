<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Kebutuhan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      color: #111827;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;

      font-size: 32px;

      margin-bottom: 8px;
    }

    h1 {
      text-align: center;

      margin: 0 0 8px;

      font-size: 27px;
    }

    .subtitle {
      text-align: center;

      color: #6b7280;

      margin:
        0 0 25px;
    }

    label {
      display: block;

      margin:
        14px 0 7px;

      font-weight: 700;

      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border:
        1px solid #d1d5db;

      border-radius: 10px;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 13px;

      border: 0;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {
      opacity: .6;

      cursor:
        not-allowed;
    }

    .register {
      text-align: center;

      margin-top: 20px;

      color: #6b7280;

      font-size: 14px;
    }

    .register button {
      width: auto;

      margin: 0;

      padding: 0;

      background: none;

      color: #2563eb;

      font-size: 14px;
    }

    .error {
      margin-top: 15px;

      padding: 11px;

      background: #fee2e2;

      color: #991b1b;

      border-radius: 9px;

      font-size: 13px;
    }

    .success {
      margin-top: 15px;

      padding: 11px;

      background: #dcfce7;

      color: #166534;

      border-radius: 9px;

      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .loading {
      text-align: center;

      color: #6b7280;

      font-size: 13px;

      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🚀
    </div>

    <h1>
      Kebutuhan
    </h1>

    <p class="subtitle">
      Login untuk melanjutkan
    </p>


    <form id="loginForm">

      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >


      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >


      <div
        id="error"
        class="error hidden">
      </div>


      <div
        id="success"
        class="success hidden">
      </div>


      <button
        id="loginBtn"
        type="submit">

        <span id="loginText">
          Login
        </span>

        <span
          id="loadingText"
          class="hidden">

          Memproses...

        </span>

      </button>

    </form>


    <div class="register">

      Belum punya akun?

      <button
        id="registerBtn"
        type="button">

        Daftar

      </button>

    </div>


    <div
      id="registerArea"
      class="hidden">

      <form id="registerForm">

        <label>
          Nama
        </label>

        <input
          id="registerName"
          type="text"
          placeholder="Nama Anda"
        >


        <label>
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          placeholder="nama@email.com"
        >


        <label>
          Password
        </label>

        <input
          id="registerPassword"
          type="password"
          placeholder="Minimal 6 karakter"
        >


        <button
          type="submit"
          id="createAccountBtn">

          Buat Akun

        </button>

      </form>

    </div>

  </div>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // ==========================================
  // FIREBASE CONFIG
  // ==========================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyCUFHkwOfNo-JCGHWG3dWcnISoYLg7vGnY",

    authDomain:
      "butuhin.firebaseapp.com",

    projectId:
      "butuhin",

    storageBucket:
      "butuhin.firebasestorage.app",

    messagingSenderId:
      "331896660506",

    appId:
      "1:331896660506:web:7a03f433101b81dd74e7a3"

  };


  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  // ==========================================
  // DOM
  // ==========================================

  const loginForm =
    document.getElementById(
      "loginForm"
    );

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const loginText =
    document.getElementById(
      "loginText"
    );

  const loadingText =
    document.getElementById(
      "loadingText"
    );

  const errorBox =
    document.getElementById(
      "error"
    );

  const successBox =
    document.getElementById(
      "success"
    );

  const registerBtn =
    document.getElementById(
      "registerBtn"
    );

  const registerArea =
    document.getElementById(
      "registerArea"
    );

  const registerForm =
    document.getElementById(
      "registerForm"
    );


  // ==========================================
  // CEK LOGIN
  // ==========================================

  onAuthStateChanged(
    auth,
    user => {

      if (user) {

        window.location.href =
          "index.html";

      }

    }
  );


  // ==========================================
  // LOGIN
  // ==========================================

  loginForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      hideMessages();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      loginBtn.disabled =
        true;

      loginText.classList.add(
        "hidden"
      );

      loadingText.classList.remove(
        "hidden"
      );


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        successBox.textContent =
          "Login berhasil. Membuka dashboard...";

        successBox.classList.remove(
          "hidden"
        );


        setTimeout(
          () => {

            window.location.href =
              "index.html";

          },
          400
        );


      } catch (error) {

        console.error(error);

        errorBox.textContent =
          getFirebaseError(
            error.code
          );

        errorBox.classList.remove(
          "hidden"
        );

      } finally {

        loginBtn.disabled =
          false;

        loginText.classList.remove(
          "hidden"
        );

        loadingText.classList.add(
          "hidden"
        );

      }

    }
  );


  // ==========================================
  // REGISTER AREA
  // ==========================================

  registerBtn.addEventListener(
    "click",
    () => {

      registerArea.classList.toggle(
        "hidden"
      );

    }
  );


  // ==========================================
  // REGISTER
  // ==========================================

  registerForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      hideMessages();


      const name =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "registerPassword"
          )
          .value;


      if (!name) {

        showError(
          "Nama wajib diisi."
        );

        return;

      }


      if (password.length < 6) {

        showError(
          "Password minimal 6 karakter."
        );

        return;

      }


      const button =
        document.getElementById(
          "createAccountBtn"
        );


      button.disabled =
        true;

      button.textContent =
        "Membuat akun...";


      try {

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          result.user,
          {
            displayName: name
          }
        );


        await setDoc(
          doc(
            db,
            "users",
            result.user.uid
          ),
          {

            uid:
              result.user.uid,

            name,

            email,

            createdAt:
              serverTimestamp()

          }
        );


        successBox.textContent =
          "Akun berhasil dibuat!";

        successBox.classList.remove(
          "hidden"
        );


        setTimeout(
          () => {

            window.location.href =
              "index.html";

          },
          500
        );


      } catch (error) {

        console.error(error);

        showError(
          getFirebaseError(
            error.code
          )
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Buat Akun";

      }

    }
  );


  // ==========================================
  // HELPERS
  // ==========================================

  function hideMessages() {

    errorBox.classList.add(
      "hidden"
    );

    successBox.classList.add(
      "hidden"
    );

  }


  function showError(
    message
  ) {

    errorBox.textContent =
      message;

    errorBox.classList.remove(
      "hidden"
    );

  }


  function getFirebaseError(
    code
  ) {

    const errors = {

      "auth/invalid-email":
        "Format email tidak valid.",

      "auth/user-not-found":
        "Email belum terdaftar.",

      "auth/wrong-password":
        "Password salah.",

      "auth/invalid-credential":
        "Email atau password salah.",

      "auth/email-already-in-use":
        "Email sudah digunakan.",

      "auth/weak-password":
        "Password terlalu lemah.",

      "auth/too-many-requests":
        "Terlalu banyak percobaan. Coba lagi nanti.",

      "auth/network-request-failed":
        "Koneksi internet bermasalah."

    };


    return (
      errors[code] ||
      "Terjadi kesalahan. Silakan coba lagi."
    );

  }

</script>

</body>
</html>
