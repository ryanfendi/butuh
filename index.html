<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>BUTUH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .tagline {
      color: #687386;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #3159c9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .user {
      display: none;
    }

    .user img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .email {
      color: #687386;
      font-size: 14px;
      margin: 5px 0 15px;
      word-break: break-all;
    }

    .logout {
      background: #e9edf5;
      color: #172033;
      margin-top: 10px;
    }

    .status {
      padding: 10px;
      border-radius: 10px;
      background: #f1f5ff;
      color: #3159c9;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">
    🔵 BUTUH
  </div>

  <div class="tagline">
    Kamu butuh. Ada yang bisa.
  </div>


  <!-- STATUS -->

  <div id="status" class="status">
    Memeriksa login...
  </div>


  <!-- LOGIN -->

  <div id="loginCard" class="card">

    <h2>
      Mulai menggunakan BUTUH
    </h2>

    <p>
      Masuk menggunakan akun Google
      untuk membuat dan mengambil kebutuhan.
    </p>

    <button id="loginBtn">
      🔵 Masuk dengan Google
    </button>

  </div>


  <!-- USER -->

  <div id="userCard" class="card user">

    <img
      id="userPhoto"
      src=""
      alt="Foto profil"
    >

    <div
      id="userName"
      class="name"
    ></div>

    <div
      id="userEmail"
      class="email"
    ></div>

    <button id="postBtn">
      ＋ Posting Kebutuhan
    </button>

    <button
      id="logoutBtn"
      class="logout"
    >
      Keluar
    </button>

  </div>

</div>


<!-- FIREBASE -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =====================================
     GANTI DENGAN CONFIG FIREBASE ANDA
  ===================================== */

  const firebaseConfig = {

    apiKey: "MASUKKAN_API_KEY_ANDA",

    authDomain:
      "MASUKKAN_AUTH_DOMAIN_ANDA",

    projectId:
      "MASUKKAN_PROJECT_ID_ANDA",

    storageBucket:
      "MASUKKAN_STORAGE_BUCKET_ANDA",

    messagingSenderId:
      "MASUKKAN_MESSAGING_SENDER_ID_ANDA",

    appId:
      "MASUKKAN_APP_ID_ANDA"

  };


  /* =====================================
     FIREBASE
  ===================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const provider =
    new GoogleAuthProvider();


  /* =====================================
     ELEMENT
  ===================================== */

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );

  const loginCard =
    document.getElementById(
      "loginCard"
    );

  const userCard =
    document.getElementById(
      "userCard"
    );

  const userName =
    document.getElementById(
      "userName"
    );

  const userEmail =
    document.getElementById(
      "userEmail"
    );

  const userPhoto =
    document.getElementById(
      "userPhoto"
    );

  const status =
    document.getElementById(
      "status"
    );


  /* =====================================
     LOGIN
  ===================================== */

  loginBtn.addEventListener(
    "click",
    async () => {

      try {

        loginBtn.disabled = true;

        loginBtn.textContent =
          "⏳ Membuka Google...";

        await signInWithPopup(
          auth,
          provider
        );

      } catch(error) {

        console.error(error);

        alert(
          "Login gagal:\n" +
          error.message
        );

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
          "🔵 Masuk dengan Google";

      }

    }
  );


  /* =====================================
     LOGOUT
  ===================================== */

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

      } catch(error) {

        alert(
          "Gagal keluar: " +
          error.message
        );

      }

    }
  );


  /* =====================================
     AUTH STATE
  ===================================== */

  onAuthStateChanged(
    auth,
    user => {

      if(user){

        loginCard.style.display =
          "none";

        userCard.style.display =
          "block";

        status.textContent =
          "🟢 Anda sudah login";

        userName.textContent =
          user.displayName ||
          "Pengguna BUTUH";

        userEmail.textContent =
          user.email ||
          "";

        userPhoto.src =
          user.photoURL ||
          "https://via.placeholder.com/100";

      }else{

        loginCard.style.display =
          "block";

        userCard.style.display =
          "none";

        status.textContent =
          "🔵 Silakan login";

      }

    }
  );


  /* =====================================
     POST BUTTON
  ===================================== */

  document
    .getElementById("postBtn")
    .addEventListener(
      "click",
      () => {

        alert(
          "🚧 Fitur posting akan kita buat pada langkah berikutnya."
        );

      }
    );

</script>

</body>
</html>
