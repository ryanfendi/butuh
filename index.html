<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kebutuhan Marketplace</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="script.js"></script>
</head>

<body>

<header class="topbar">

  <div class="logo">
    🚀 Kebutuhan
  </div>

  <div class="user-area">
    <span id="userName">Memuat...</span>
    <button id="logoutBtn" class="btn danger small">
      Keluar
    </button>
  </div>

</header>


<main class="container">

  <!-- HERO -->

  <section class="hero">

    <div>
      <h1>Cari Kebutuhan</h1>

      <p>
        Temukan orang yang membutuhkan produk atau jasa Anda.
      </p>
    </div>

    <button id="openPostBtn" class="btn primary">
      + Posting Kebutuhan
    </button>

  </section>


  <!-- FILTER -->

  <section class="toolbar">

    <input
      type="text"
      id="searchInput"
      placeholder="🔎 Cari kebutuhan..."
    >

    <select id="categoryFilter">

      <option value="all">
        Semua kategori
      </option>

      <option value="design">
        Desain
      </option>

      <option value="website">
        Website
      </option>

      <option value="programming">
        Programming
      </option>

      <option value="marketing">
        Marketing
      </option>

      <option value="writing">
        Penulisan
      </option>

      <option value="other">
        Lainnya
      </option>

    </select>

  </section>


  <!-- ACTIVE NEEDS -->

  <section>

    <div class="section-title">

      <div>
        <h2>🔥 Kebutuhan Aktif</h2>
        <span id="needCount">0</span>
      </div>

    </div>


    <div id="loadingNeeds" class="loading">
      Memuat kebutuhan...
    </div>


    <div id="needsList" class="needs-grid"></div>


    <div id="emptyNeeds" class="empty hidden">

      <div class="empty-icon">
        📭
      </div>

      <h3>Belum ada kebutuhan</h3>

      <p>
        Jadilah orang pertama yang membuat kebutuhan.
      </p>

    </div>

  </section>

</main>


<!-- ======================================
     POST NEED MODAL
======================================= -->

<div id="postModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Posting Kebutuhan</h2>

      <button
        class="close"
        id="closePostBtn">
        ×
      </button>

    </div>


    <form id="postForm">

      <label>
        Judul kebutuhan
      </label>

      <input
        id="needTitle"
        type="text"
        placeholder="Contoh: Saya butuh desain logo"
        required
      >


      <label>
        Kategori
      </label>

      <select id="needCategory" required>

        <option value="">
          Pilih kategori
        </option>

        <option value="design">
          Desain
        </option>

        <option value="website">
          Website
        </option>

        <option value="programming">
          Programming
        </option>

        <option value="marketing">
          Marketing
        </option>

        <option value="writing">
          Penulisan
        </option>

        <option value="other">
          Lainnya
        </option>

      </select>


      <label>
        Deskripsi
      </label>

      <textarea
        id="needDescription"
        rows="5"
        placeholder="Jelaskan kebutuhan Anda..."
        required
      ></textarea>


      <label>
        Budget
      </label>

      <input
        id="needBudget"
        type="number"
        min="0"
        placeholder="Contoh: 500000"
        required
      >


      <label>
        Deadline
      </label>

      <input
        id="needDeadline"
        type="date"
        required
      >


      <div
        id="postError"
        class="form-error hidden">
      </div>


      <button
        id="submitNeedBtn"
        type="submit"
        class="btn primary full">

        <span id="submitNeedText">
          Posting Kebutuhan
        </span>

        <span
          id="submitNeedLoading"
          class="hidden">
          Menyimpan...
        </span>

      </button>

    </form>

  </div>

</div>



<!-- ======================================
     DETAIL MODAL
======================================= -->

<div id="detailModal" class="modal hidden">

  <div class="modal-box large">

    <div class="modal-header">

      <h2>Detail Kebutuhan</h2>

      <button
        id="closeDetailBtn"
        class="close">
        ×
      </button>

    </div>


    <div id="detailContent">

      <div class="loading">
        Memuat...
      </div>

    </div>


    <!-- OFFER FORM -->

    <div
      id="offerSection"
      class="offer-section hidden">

      <h3>
        💰 Ajukan Penawaran
      </h3>

      <form id="offerForm">

        <label>
          Harga penawaran
        </label>

        <input
          id="offerPrice"
          type="number"
          min="0"
          required
          placeholder="Contoh: 350000"
        >


        <label>
          Estimasi pengerjaan</label>

        <input
          id="offerDuration"
          type="text"
          required
          placeholder="Contoh: 3 hari"
        >


        <label>
          Pesan
        </label>

        <textarea
          id="offerMessage"
          rows="4"
          required
          placeholder="Jelaskan penawaran Anda..."
        ></textarea>


        <div
          id="offerError"
          class="form-error hidden">
        </div>


        <button
          id="submitOfferBtn"
          class="btn primary full">

          Ajukan Penawaran

        </button>

      </form>

    </div>


    <!-- OFFERS -->

    <div
      id="offersSection"
      class="offers-section hidden">

      <h3>
        📋 Penawaran
      </h3>

      <div id="offersList"></div>

    </div>

  </div>

</div>



<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>

</body>
</html>
