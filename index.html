<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>BUTUH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #687386;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #3159c9;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">
    🔵 BUTUH
  </div>

  <div class="subtitle">
    Kamu butuh. Ada yang bisa.
  </div>

  <div class="card">

    <h2>
      Apa yang Anda butuhkan?
    </h2>

    <p>
      Posting kebutuhan dan temukan
      orang yang bisa membantu.
    </p>

    <button>
      ＋ Posting Kebutuhan
    </button>

  </div>

</div>

</body>
</html>
