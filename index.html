<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BUTUH - Kamu butuh, ada yang bisa</title>

<style>

*{

}

html{
  scroll-behavior:smooth;

body{
  margin:0;

}

button,
input,

textarea{

}

}

.app{

.header{
  display:flex;

}

.logo{

}

}

.hero{
  padding:24px;

}

.hero h1{
  margin:0 0 8px;

}

.card{

.status{

.primary{

.secondary{

}

.login-box{

}

.login-btn{

  border:1px solid #dfe4ed;

.user-box{

}

.user-info{

}

.user-info img{

  height:58px;

}

.user-name{

}

.user-email{

  font-size:14px;
  word-break:break-all;
}

.logout{
  margin-top:10px;
}

.search-input,
input,
select,
textarea{
  width:100%;
  border:1px solid #dfe4ed;
  background:white;
  color:#172033;
  border-radius:14px;
  padding:14px;

}

input:focus,

}

.search-input{
  margin-bottom:12px;
}

textarea{
  min-height:100px;

}

label{

  font-size:14px;

}

.form-group{
  margin-bottom:15px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:22px 0 12px;
}

.section-title h2{
  margin:0;

}

.count{
  color:#737c8c;
  font-size:14px;

}

.need{
  background:white;
  border-radius:20px;
  padding:18px;

  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.need-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.need-title{
  font-size:20px;
  font-weight:900;
  line-height:1.3;
}

.badge{
  flex-shrink:0;
  padding:7px 10px;
  border-radius:10px;
  background:#eef3ff;
  color:#3159c9;
  font-size:12px;
  font-weight:800;
}

.price{
  margin-top:14px;
  color:#168347;
  font-size:25px;
  font-weight:900;
}

.info{

}

.timer{

}

.timer.expired{

}

.help-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:14px;
  background:#3159c9;
  color:white;
  font-size:17px;
  font-weight:900;
}

.empty{
  background:white;
  border-radius:20px;
  padding:35px 20px;
  text-align:center;
  color:#737c8c;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.error-box{
  background:#fff0f0;
  color:#b3261e;
}

.hidden{
  display:none!important;
}


/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.55);
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow-y:auto;
  background:white;
  border-radius:25px 25px 0 0;
  padding:22px 18px 30px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#edf1f7;
  font-size:26px;
}

.post-status{
  display:none;
  margin-bottom:14px;
  padding:12px;
  border-radius:12px;
  background:#eef3ff;
  color:#3159c9;
  font-size:14px;
}

@media(min-width:700px){

  .modal{
    align-items:center;
    padding:20px;
  }

  .modal-content{
    border-radius:24px;
  }

}

</style>
</head>

<body>

<script type="module">

/* =========================================
   FIREBASE IMPORT
========================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG

   GANTI SEMUA NILAI DI BAWAH
   DENGAN CONFIG FIREBASE ANDA
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCUFHkwOfNo-JCGHWG3dWcnISoYLg7vGnY",

  authDomain:
    "butuhin.firebaseapp.com",

  projectId:
    "butuhin",

  storageBucket:
    "butuhin.firebasestorage.app",

  messagingSenderId:
    "331896660506",

  appId:
    "1:331896660506:web:7a03f433101b81dd74e7a3"

};


/* =========================================
   START FIREBASE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const provider =
  new GoogleAuthProvider();


/* =========================================
   ELEMENT
========================================= */

const loginBox =
  document.getElementById("loginBox");

const userBox =
  document.getElementById("userBox");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const userName =
  document.getElementById("userName");

const userEmail =
  document.getElementById("userEmail");

const userPhoto =
  document.getElementById("userPhoto");

const userMini =
  document.getElementById("userMini");

const statusBox =
  document.getElementById("statusBox");

const postModal =
  document.getElementById("postModal");

const closeModalBtn =
  document.getElementById("closeModal");

const needForm =
  document.getElementById("needForm");

const submitBtn =
  document.getElementById("submitBtn");

const postStatus =
  document.getElementById("postStatus");

const needsList =
  document.getElementById("needsList");

const needCount =
  document.getElementById("needCount");

const searchInput =
  document.getElementById("searchInput");

const categoryFilter =
  document.getElementById("categoryFilter");


let currentUser = null;

let allNeeds = [];

let firestoreConnected = false;


/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener(
  "click",
  async () => {

    try{

      loginBtn.disabled = true;

      loginBtn.textContent =
        "⏳ Membuka Google...";

      await signInWithPopup(
        auth,
        provider
      );

    }catch(error){

      console.error(error);

      alert(
        "Login gagal:\n\n" +
        error.message
      );

    }finally{

      loginBtn.disabled = false;

      loginBtn.textContent =
        "🔵 Masuk dengan Google";

    }

  }
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

    }catch(error){

      alert(
        "Gagal keluar:\n" +
        error.message
      );

    }

  }
);


/* =========================================
   AUTH STATUS
========================================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    if(user){

      loginBox.style.display =
        "none";

      userBox.style.display =
        "block";

      statusBox.textContent =
        "🟢 Login sebagai " +
        (
          user.displayName ||
          "Pengguna"
        );

      userName.textContent =
        user.displayName ||
        "Pengguna BUTUH";

      userEmail.textContent =
        user.email ||
        "";

      if(user.photoURL){

        userPhoto.src =
          user.photoURL;

        userMini.src =
          user.photoURL;

        userMini.style.display =
          "block";

      }else{

        userMini.style.display =
          "none";

      }

    }else{

      loginBox.style.display =
        "block";

      userBox.style.display =
        "none";

      userMini.style.display =
        "none";

      statusBox.textContent =
        "🔵 Silakan login untuk posting kebutuhan";

    }

  }
);


/* =========================================
   MODAL
========================================= */

function openModal(){

  if(!currentUser){

    alert(
      "Silakan login terlebih dahulu."
    );

    return;

  }

  postStatus.style.display =
    "none";

  postModal.classList.add(
    "show"
  );

}


function closeModal(){

  postModal.classList.remove(
    "show"
  );

}


document
  .getElementById("heroPostBtn")
  .addEventListener(
    "click",
    openModal
  );


document
  .getElementById("userPostBtn")
  .addEventListener(
    "click",
    openModal
  );


closeModalBtn.addEventListener(
  "click",
  closeModal
);


/* TUTUP JIKA TEKAN AREA GELAP */

postModal.addEventListener(
  "click",
  event => {

    if(
      event.target === postModal
    ){

      closeModal();

    }

  }
);


/* =========================================
   POSTING KEBUTUHAN
========================================= */

needForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentUser){

      alert(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const category =
      document
        .getElementById("category")
        .value;


    const budget =
      Number(
        document
          .getElementById("budget")
          .value
      );


    const province =
      document
        .getElementById("province")
        .value;


    const city =
      document
        .getElementById("city")
        .value
        .trim();


    const location =
      document
        .getElementById("location")
        .value
        .trim();


    const duration =
      Number(
        document
          .getElementById("duration")
          .value
      );


    if(
      !title ||
      budget <= 0 ||
      !province ||
      !city ||
      duration <= 0
    ){

      alert(
        "Mohon lengkapi semua data."
      );

      return;

    }


    const now =
      Date.now();


    const expiresAt =
      now +
      (
        duration *
        60 *
        60 *
        1000
      );


    const newNeed = {

      title: title,

      category: category,

      budget: budget,

      province: province,

      city: city,

      location: location,

      ownerId:
        currentUser.uid,

      ownerName:
        currentUser.displayName ||
        "Pengguna",

      ownerPhoto:
        currentUser.photoURL ||
        "",

      createdAt:
        serverTimestamp(),

      createdAtMs:
        now,

      expiresAt:
        expiresAt,

      status:
        "active"

    };


    /* SIMPAN DATA */

    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "⚡ Mengirim...";


    /*
      LANGSUNG TUTUP POPUP

      Penyimpanan tetap berjalan
      di background
    */

    closeModal();


    /*
      FORM LANGSUNG DIKOSONGKAN
    */

    needForm.reset();


    /*
      TAMPILKAN STATUS
      DI HALAMAN UTAMA
    */

    statusBox.textContent =
      "⚡ Sedang mengirim kebutuhan...";


    try{

      const savePromise =
        addDoc(
          collection(
            db,
            "needs"
          ),
          newNeed
        );


      await savePromise;


      statusBox.textContent =
        "✅ Kebutuhan berhasil diposting";


      setTimeout(
        () => {

          if(currentUser){

            statusBox.textContent =
              "🟢 Login sebagai " +
              (
                currentUser.displayName ||
                "Pengguna"
              );

          }

        },
        3000
      );


    }catch(error){

      console.error(
        "POST ERROR:",
        error
      );


      statusBox.textContent =
        "❌ Gagal menyimpan kebutuhan";


      alert(
        "Posting gagal disimpan:\n\n" +
        error.message
      );

    }finally{

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "⚡ Posting Sekarang";

    }

  }
);


/* =========================================
   LOAD FIRESTORE
========================================= */

function loadNeeds(){

  needsList.innerHTML =
    `
    <div class="empty">
      ⏳ Memuat kebutuhan...
    </div>
    `;


  onSnapshot(

    collection(
      db,
      "needs"
    ),

    snapshot => {

      firestoreConnected =
        true;


      console.log(
        "Firestore aktif:",
        snapshot.size
      );


      allNeeds =
        snapshot.docs.map(
          doc => ({

            id:
              doc.id,

            ...doc.data()

          })
        );


      /*
        URUTKAN DARI TERBARU
        TANPA orderBy FIRESTORE
      */

      allNeeds.sort(
        (a,b) =>

          Number(
            b.createdAtMs || 0
          )

          -

          Number(
            a.createdAtMs || 0
          )

      );


      renderNeeds();

    },


    error => {

      console.error(
        "FIRESTORE ERROR:",
        error
      );


      firestoreConnected =
        true;


      needCount.textContent =
        "Error";


      needsList.innerHTML =
        `
        <div class="empty error-box">

          <strong>
            ❌ Gagal memuat kebutuhan
          </strong>

          <br><br>

          ${escapeHtml(
            error.message ||
            "Terjadi kesalahan database."
          )}

          <br><br>

          <button
            class="primary"
            onclick="location.reload()">

            🔄 Coba Lagi

          </button>

        </div>
        `;

    }

  );

}


loadNeeds();


/* =========================================
   JIKA LOADING TERLALU LAMA
========================================= */

setTimeout(
  () => {

    if(!firestoreConnected){

      needsList.innerHTML =
        `
        <div class="empty">

          <strong>
            ⏳ Database membutuhkan waktu lebih lama.
          </strong>

          <br><br>

          Periksa koneksi internet Anda.

          <br><br>

          <button
            class="primary"
            onclick="location.reload()">

            🔄 Muat Ulang

          </button>

        </div>
        `;

    }

  },
  10000
);


/* =========================================
   RENDER KEBUTUHAN
========================================= */

function renderNeeds(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const selectedCategory =
    categoryFilter.value;


  const now =
    Date.now();


  let data =
    allNeeds.filter(
      need =>

        need.status ===
        "active"

        &&

        Number(
          need.expiresAt || 0
        ) > now
    );


  /* CARI */

  if(keyword){

    data =
      data.filter(
        need => {

          const text =
            (
              String(
                need.title || ""
              )

              + " " +

              String(
                need.city || ""
              )

              + " " +

              String(
                need.province || ""
              )
            )
            .toLowerCase();


          return text.includes(
            keyword
          );

        }
      );

  }


  /* FILTER KATEGORI */

  if(
    selectedCategory !==
    "all"
  ){

    data =
      data.filter(
        need =>

          need.category ===
          selectedCategory
      );

  }


  needCount.textContent =
    data.length +
    (
      data.length === 1
        ? " kebutuhan"
        : " kebutuhan"
    );


  if(data.length === 0){

    needsList.innerHTML =
      `
      <div class="empty">

        🔎

        <br><br>

        <strong>
          Belum ada kebutuhan aktif.
        </strong>

        <br><br>

        Jadilah yang pertama
        memposting kebutuhan.

      </div>
      `;

    return;

  }


  needsList.innerHTML =
    data.map(
      need => {

        return `

        <article class="need">

          <div class="need-head">

            <div class="need-title">

              ${escapeHtml(
                need.title
              )}

            </div>

            <div class="badge">

              ${escapeHtml(
                need.category
              )}

            </div>

          </div>


          <div class="price">

            ${formatRupiah(
              need.budget
            )}

          </div>


          <div class="info">

            📍
            ${escapeHtml(
              need.city
            )},
            ${escapeHtml(
              need.province
            )}

            <br>

            📌
            ${escapeHtml(
              need.location ||
              "Lokasi detail tidak diberikan"
            )}

            <br>

            👤
            ${escapeHtml(
              need.ownerName ||
              "Pengguna BUTUH"
            )}

          </div>


          <div
            class="timer"
            data-expires="${Number(
              need.expiresAt
            )}">

            ⏳ Menghitung...

          </div>


          <button
            class="help-btn"
            data-id="${need.id}">

            🙋 SAYA BISA

          </button>

        </article>

        `;

      }
    )
    .join("");


  updateTimers();


  document
    .querySelectorAll(
      ".help-btn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            handleHelp(
              button.dataset.id
            );

          }
        );

      }
    );

}


/* =========================================
   SAYA BISA
========================================= */

function handleHelp(id){

  const need =
    allNeeds.find(
      item =>
        item.id === id
    );


  if(!need) return;


  if(!currentUser){

    alert(
      "Silakan login terlebih dahulu."
    );

    return;

  }


  if(
    need.ownerId ===
    currentUser.uid
  ){

    alert(
      "Ini adalah kebutuhan Anda sendiri."
    );

    return;

  }


  alert(
    "🙋 Anda memilih kebutuhan ini.\n\n" +
    "Fitur chat dan penawaran akan dibuat pada tahap berikutnya."
  );

}


/* =========================================
   SEARCH & FILTER
========================================= */

searchInput.addEventListener(
  "input",
  renderNeeds
);


categoryFilter.addEventListener(
  "change",
  renderNeeds
);


/* =========================================
   TIMER
========================================= */

function updateTimers(){

  document
    .querySelectorAll(
      ".timer"
    )
    .forEach(
      element => {

        const expires =
          Number(
            element.dataset.expires
          );


        const remaining =
          expires -
          Date.now();


        if(remaining <= 0){

          element.textContent =
            "🔴 KEBUTUHAN BERAKHIR";

          element.classList.add(
            "expired"
          );

        }else{

          element.classList.remove(
            "expired"
          );

          element.textContent =
            "⏳ " +
            formatRemaining(
              remaining
            );

        }

      }
    );

}


setInterval(
  () => {

    updateTimers();


    /*
      SETIAP MENIT,
      RENDER ULANG AGAR
      POSTING EXPIRED HILANG
    */

  },
  1000
);


setInterval(
  renderNeeds,
  60000
);


/* =========================================
   FORMAT RUPIAH
========================================= */

function formatRupiah(value){

  return new Intl.NumberFormat(
    "id-ID",
    {

      style:
        "currency",

      currency:
        "IDR",

      maximumFractionDigits:
        0

    }
  )
  .format(
    Number(value) || 0
  );

}


/* =========================================
   FORMAT WAKTU
========================================= */

function formatRemaining(ms){

  if(ms <= 0){

    return "00:00:00";

  }


  const totalSeconds =
    Math.floor(
      ms / 1000
    );


  const days =
    Math.floor(
      totalSeconds / 86400
    );


  const hours =
    Math.floor(
      (
        totalSeconds % 86400
      ) / 3600
    );


  const minutes =
    Math.floor(
      (
        totalSeconds % 3600
      ) / 60
    );


  const seconds =
    totalSeconds % 60;


  const h =
    String(hours)
      .padStart(2,"0");


  const m =
    String(minutes)
      .padStart(2,"0");


  const s =
    String(seconds)
      .padStart(2,"0");


  if(days > 0){

    return (
      days +
      " hari " +
      h +
      ":" +
      m +
      ":" +
      s
    );

  }


  return (
    h +
    ":" +
    m +
    ":" +
    s
  );

}


/* =========================================
   SECURITY HTML
========================================= */

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>
